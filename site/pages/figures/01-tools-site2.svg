<svg viewBox="0 0 760 400" role="img" aria-label="취득 방식별 작업 거리와 정밀도 산점도. 가로축 0.1미터에서 10킬로미터, 세로축 0.1밀리미터에서 1000밀리미터, 모두 로그 눈금">
        <text class="t-tick" x="14" y="26" transform="rotate(-90 14 26)" text-anchor="end">← 정밀</text>

        <line x1="80" y1="30" x2="80" y2="346" stroke="var(--rule)" stroke-width="1"></line>
        <line x1="80" y1="346" x2="700" y2="346" stroke="var(--rule)" stroke-width="1"></line>

        <line x1="80" y1="60.6" x2="700" y2="60.6" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="80" y1="128.9" x2="700" y2="128.9" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="80" y1="197.3" x2="700" y2="197.3" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="80" y1="265.6" x2="700" y2="265.6" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="80" y1="333.9" x2="700" y2="333.9" stroke="var(--rule-soft)" stroke-width="1"></line>

        <text class="t-tick" x="72" y="64" text-anchor="end">0.1 mm</text>
        <text class="t-tick" x="72" y="132" text-anchor="end">1 mm</text>
        <text class="t-tick" x="72" y="201" text-anchor="end">10 mm</text>
        <text class="t-tick" x="72" y="269" text-anchor="end">100 mm</text>
        <text class="t-tick" x="72" y="337" text-anchor="end">1 m</text>

        <line x1="201.6" y1="30" x2="201.6" y2="346" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="323.2" y1="30" x2="323.2" y2="346" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="444.8" y1="30" x2="444.8" y2="346" stroke="var(--rule-soft)" stroke-width="1"></line>
        <line x1="566.4" y1="30" x2="566.4" y2="346" stroke="var(--rule-soft)" stroke-width="1"></line>
        <text class="t-tick" x="80" y="362" text-anchor="middle">0.1 m</text>
        <text class="t-tick" x="201.6" y="362" text-anchor="middle">1 m</text>
        <text class="t-tick" x="323.2" y="362" text-anchor="middle">10 m</text>
        <text class="t-tick" x="444.8" y="362" text-anchor="middle">100 m</text>
        <text class="t-tick" x="566.4" y="362" text-anchor="middle">1 km</text>
        <text class="t-tick" x="688" y="362" text-anchor="middle">10 km</text>
        <text class="t-lab" x="390" y="384" text-anchor="middle">대표 작업 거리 →</text>

        <rect x="201.6" y="128.9" width="328.2" height="169.3" fill="none" stroke="var(--far)" stroke-width="1" stroke-dasharray="4 3" rx="2"></rect>
        <text class="t-lab" x="310" y="274" fill="var(--far)">사진측량</text>
        <text class="t-tick" x="310" y="289" fill="var(--far)">조건 의존 · 범위로만 표시</text>

        <circle cx="182.8" cy="60.6" r="5" fill="var(--near)"></circle>
        <text class="t-lab" x="182.8" y="50" text-anchor="middle">구조광 · ToF</text>
        <text class="t-tick" x="182.8" y="82" text-anchor="middle">0.1 mm @0.35–1.2 m</text>

        <circle cx="323.2" cy="148.0" r="5" fill="var(--near)"></circle>
        <text class="t-lab" x="334" y="145">지상 고정식 라이다 (TLS)</text>
        <text class="t-tick" x="334" y="158">1.9 mm @10 m</text>

        <circle cx="359.8" cy="182.1" r="5" fill="var(--near)"></circle>
        <text class="t-lab" x="371" y="180">모바일 · 핸드헬드 SLAM</text>
        <text class="t-tick" x="371" y="193">평균 6 mm · 최대 18 mm</text>

        <circle cx="286.6" cy="197.3" r="5" fill="var(--near)"></circle>
        <text class="t-lab" x="297" y="214">스마트폰 라이다</text>
        <text class="t-tick" x="297" y="227">약 10 mm @≤5 m</text>

        <circle cx="466.2" cy="245.1" r="5" fill="var(--near)"></circle>
        <text class="t-lab" x="477" y="243">드론 라이다</text>
        <text class="t-tick" x="477" y="256">수평 50 mm @150 m</text>

        <circle cx="603.0" cy="265.6" r="5" fill="var(--near)"></circle>
        <text class="t-lab" x="614" y="263">항공 라이다</text>
        <text class="t-tick" x="614" y="276">RMSEz 100 mm</text>

        <rect x="80" y="300" width="212" height="44" fill="var(--sunk)" stroke="var(--rule)" stroke-width="1" rx="2"></rect>
        <text class="t-tick" x="92" y="315">축에 올리지 않은 두 방식</text>
        <text class="t-tick" x="92" y="328" fill="var(--far)">360 이미징 — 측량급 정밀도 아님</text>
        <text class="t-tick" x="92" y="340" fill="var(--far)">NeRF · 3DGS — 기하 정확도 미검증</text>
      </svg>
