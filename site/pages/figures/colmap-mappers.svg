<svg viewBox="0 0 760 270" role="img" aria-label="증분, 전역, 계층 매퍼의 차이를 보여 주는 도식">
  <text class="t-hd" x="20" y="26">증분 (incremental)</text>
  <text class="t-tick" x="20" y="42">두 장에서 시작해 한 장씩 붙인다</text>
  <line x1="60" y1="120" x2="110" y2="100" stroke="var(--near)" stroke-width="1.2"></line>
  <line x1="110" y1="100" x2="150" y2="140" stroke="var(--near)" stroke-width="1.2"></line>
  <line x1="150" y1="140" x2="200" y2="110" stroke="var(--near)" stroke-width="1.2"></line>
  <line x1="200" y1="110" x2="210" y2="170" stroke="var(--near)" stroke-width="1.2" stroke-dasharray="3 3"></line>
  <circle cx="60" cy="120" r="9" fill="var(--near)"></circle>
  <circle cx="110" cy="100" r="9" fill="var(--near)"></circle>
  <circle cx="150" cy="140" r="9" fill="var(--near)" opacity=".7"></circle>
  <circle cx="200" cy="110" r="9" fill="var(--near)" opacity=".5"></circle>
  <circle cx="210" cy="170" r="9" fill="var(--surface)" stroke="var(--near)" stroke-dasharray="2 2"></circle>
  <text class="t-tick" x="20" y="205">등록 → 삼각측량 → 번들조정 반복</text>
  <text class="t-tick" x="20" y="221">견고하지만 사진이 많으면 느리다</text>
  <line x1="262" y1="20" x2="262" y2="235" stroke="var(--rule)"></line>
  <text class="t-hd" x="282" y="26">전역 (global · 옛 GLOMAP)</text>
  <text class="t-tick" x="282" y="42">모든 쌍의 상대 자세를 한꺼번에 푼다</text>
  <line x1="320" y1="100" x2="380" y2="80" stroke="var(--far)"></line>
  <line x1="320" y1="100" x2="350" y2="160" stroke="var(--far)"></line>
  <line x1="320" y1="100" x2="440" y2="130" stroke="var(--far)"></line>
  <line x1="380" y1="80" x2="440" y2="130" stroke="var(--far)"></line>
  <line x1="380" y1="80" x2="350" y2="160" stroke="var(--far)"></line>
  <line x1="350" y1="160" x2="440" y2="130" stroke="var(--far)"></line>
  <line x1="440" y1="130" x2="460" y2="80" stroke="var(--far)"></line>
  <line x1="380" y1="80" x2="460" y2="80" stroke="var(--far)"></line>
  <circle cx="320" cy="100" r="9" fill="var(--far)"></circle>
  <circle cx="380" cy="80" r="9" fill="var(--far)"></circle>
  <circle cx="350" cy="160" r="9" fill="var(--far)"></circle>
  <circle cx="440" cy="130" r="9" fill="var(--far)"></circle>
  <circle cx="460" cy="80" r="9" fill="var(--far)"></circle>
  <text class="t-tick" x="282" y="205">회전 평균 → 위치 추정 → 번들조정 한 번</text>
  <text class="t-tick" x="282" y="221">개발진 주장 10~100배 빠름 (벤더)</text>
  <line x1="512" y1="20" x2="512" y2="235" stroke="var(--rule)"></line>
  <text class="t-hd" x="532" y="26">계층 (hierarchical)</text>
  <text class="t-tick" x="532" y="42">덩어리로 나눠 따로 풀고 합친다</text>
  <rect x="545" y="70" width="80" height="70" rx="3" fill="var(--near-soft)" stroke="var(--near)"></rect>
  <rect x="650" y="70" width="80" height="70" rx="3" fill="var(--near-soft)" stroke="var(--near)"></rect>
  <rect x="597" y="152" width="80" height="34" rx="3" fill="var(--surface)" stroke="var(--muted)"></rect>
  <text class="t-tick" x="585" y="110" text-anchor="middle">덩어리 A</text>
  <text class="t-tick" x="690" y="110" text-anchor="middle">덩어리 B</text>
  <text class="t-tick" x="637" y="173" text-anchor="middle">병합</text>
  <line x1="585" y1="140" x2="620" y2="152" stroke="var(--muted)"></line>
  <line x1="690" y1="140" x2="655" y2="152" stroke="var(--muted)"></line>
  <text class="t-tick" x="532" y="205">수천 장 이상 대규모 장면용</text>
  <text class="t-tick" x="532" y="221">4.2에서 GUI·Python 선택 지원</text>
  <text class="t-tick" x="20" y="258">● 등록된 사진   ○ 등록 대기   선 = 사진 쌍 사이의 기하 관계</text>
</svg>
