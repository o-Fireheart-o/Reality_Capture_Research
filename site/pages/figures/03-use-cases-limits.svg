  <text class="t-lab" x="274" y="170">자동화의 한계</text>
  <text class="t-tick" x="274" y="187">딥러닝용 라벨 데이터가 모자란다</text>
  <text class="t-lab" x="526" y="78">숙련 인력</text>
  <text class="t-tick" x="526" y="95">scan-to-BIM은 손으로 모델링</text>
  <text class="t-lab" x="526" y="124">갱신 주기</text>
  <text class="t-tick" x="526" y="141">현장이 바뀌면 점군은 곧 낡는다</text>
  <text class="t-lab" x="526" y="170">ROI 입증 (성과 개선 인정 비율)</text>
  <text class="t-tick" x="526" y="196">충분히 쓰는 집단</text>
  <rect x="628" y="186" width="82" height="13" fill="var(--far)"></rect>
