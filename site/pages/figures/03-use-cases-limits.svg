<svg viewBox="0 0 760 318" role="img" aria-label="10장의 실패 요인 여덟 가지를 센서, 데이터, 사람과 조직 세 묶음으로 나누고, 공통 문제로 수치의 출처 편중을 둔 도식">
  <rect x="10" y="14" width="236" height="32" rx="3" fill="var(--near-soft)" stroke="var(--near)"></rect>
  <text class="t-hd" x="128" y="35" text-anchor="middle">센서가 못 보는 것</text>
  <rect x="262" y="14" width="236" height="32" rx="3" fill="var(--near-soft)" stroke="var(--near)"></rect>
  <text class="t-hd" x="380" y="35" text-anchor="middle">데이터를 다루는 일</text>
  <rect x="514" y="14" width="236" height="32" rx="3" fill="var(--near-soft)" stroke="var(--near)"></rect>
  <text class="t-hd" x="632" y="35" text-anchor="middle">사람과 조직</text>
  <rect x="10" y="54" width="236" height="190" rx="3" fill="var(--surface)" stroke="var(--rule-soft)"></rect>
  <rect x="262" y="54" width="236" height="190" rx="3" fill="var(--surface)" stroke="var(--rule-soft)"></rect>
  <rect x="514" y="54" width="236" height="190" rx="3" fill="var(--surface)" stroke="var(--rule-soft)"></rect>
  <text class="t-lab" x="22" y="78">차폐와 현장 여건</text>
